name: Refresh mobile signal

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      discard_history:
        description: "Discard carried-forward mobile history before this build"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: cg-signal-mobile-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Run client domain tests
        run: |
          node --test tests/client/*.test.mjs
          node --check static/app.js
          node --check mobile/site/app.js
          node --check mobile/site/sw.js
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore publisher request cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .mobile-cache
          key: cg-signal-mobile-state-v1-${{ github.run_id }}
          restore-keys: |
            cg-signal-mobile-state-v1-
      - name: Discard carried-forward history when requested
        run: |
          if [[ "${{ inputs.discard_history || 'false' }}" == "true" ]]; then
            rm -f .mobile-cache/history/feed.json
            rm -f .mobile-cache/http/image-index.json
            rm -rf .mobile-cache/http/thumbnails
          fi
      - name: Gather and build mobile feed
        run: >-
          python mobile/build_mobile.py
          --previous-json .mobile-cache/history/feed.json
          --request-cache-dir .mobile-cache/http
      - name: Save sanitized mobile history
        run: |
          mkdir -p .mobile-cache/history
          cp mobile/dist/feed.json .mobile-cache/history/feed.json
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: mobile/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
