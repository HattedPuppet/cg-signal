name: Refresh mobile signal

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      discard_history:
        description: "Discard carried-forward mobile history before this build"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cg-signal-pr-{0}', github.event.pull_request.number) || 'cg-signal-mobile-pages' }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:browser
      - name: Run client domain tests
        run: |
          node --test tests/client/*.test.mjs
          node --check static/app.js
          node --check mobile/site/app.js
          node --check mobile/site/sw.js
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  build:
    if: ${{ always() && github.event_name != 'pull_request' && (github.event_name == 'schedule' || needs.test.result == 'success') }}
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Restore publisher request cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .mobile-cache
          key: cg-signal-mobile-state-v1-${{ github.run_id }}
          restore-keys: |
            cg-signal-mobile-state-v1-
      - name: Discard carried-forward history when requested
        run: |
          if [[ "${{ inputs.discard_history || 'false' }}" == "true" ]]; then
            rm -f .mobile-cache/history/feed.json
            rm -f .mobile-cache/http/image-index.json
            rm -rf .mobile-cache/http/thumbnails
          fi
      - name: Gather and build mobile feed
        run: >-
          python mobile/build_mobile.py
          --previous-json .mobile-cache/history/feed.json
          --request-cache-dir .mobile-cache/http
      - name: Save sanitized mobile history
        run: |
          mkdir -p .mobile-cache/history
          cp mobile/dist/feed.json .mobile-cache/history/feed.json
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: mobile/dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
