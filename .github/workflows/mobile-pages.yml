name: Refresh mobile signal

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cg-signal-mobile-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run client domain tests
        run: |
          node --test tests/client/*.test.mjs
          node --check static/app.js
          node --check mobile/site/app.js
          node --check mobile/site/sw.js
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore publisher request cache
        uses: actions/cache@v5
        with:
          path: .mobile-cache
          key: cg-signal-mobile-http-${{ github.run_id }}
          restore-keys: |
            cg-signal-mobile-http-
      - name: Recover previous public feed
        env:
          PAGES_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.json
        run: |
          mkdir -p .cache
          curl --fail --silent --show-error --location --retry 3 --output .cache/mobile-previous-feed.json "$PAGES_FEED_URL" || true
      - name: Gather and build mobile feed
        run: >-
          python mobile/build_mobile.py
          --previous-json .cache/mobile-previous-feed.json
          --request-cache-dir .mobile-cache
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
